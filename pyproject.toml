[project]
name = "intellicenter"
version = "3.11.0"
description = "Home Assistant custom integration for Pentair IntelliCenter"
readme = "README.md"
license = "GPL-3.0-only"
authors = [
    { name = "JoyfulHouse Real Estate LLC" },
]
# Tracks the Python floor of the Home Assistant release we target (2026.5.x ->
# Python 3.14.2+). HACS installs by copying files and does not read this; it
# governs our uv/CI tooling, which must resolve against that HA version.
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant>=2025.11.3",
    "pyintellicenter>=0.2.2",
]

[tool.ruff]
# Shipped code must import on the oldest supported Home Assistant
# (homeassistant>=2025.11.3 -> Python 3.13), so lint/format must not emit
# 3.14-only syntax: under py314, ruff >=0.15 rewrites `except (A, B):` to
# PEP 758 `except A, B:`, a SyntaxError on 3.13. requires-python above
# intentionally stays 3.14.2 for CI tooling. Revisit when the HA floor
# moves to a release that requires Python 3.14.
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black/formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "E203",  # whitespace before ':'
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
forced-separate = ["tests"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Use of assert detected

[tool.codespell]
ignore-words-list = "hass,timout"
skip = ".git,*.json,*.csv"
quiet-level = 2

# mypy configuration is centralized in mypy.ini (strict mode).
# Do not add a [tool.mypy] block here: mypy.ini takes precedence over
# pyproject.toml, so a second config would silently diverge.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = [
    ".git",
    ".venv",
    "venv",
]

[dependency-groups]
dev = [
    "homeassistant==2026.8.3",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "pytest-homeassistant-custom-component>=0.13.333",
    # Lint/type/security tools pinned via the lock so CI (uv sync --frozen) and
    # local runs use identical versions instead of whatever is on PATH.
    # Upper bounds keep future formatter/type-semantics majors a deliberate
    # adoption (bump them in a dedicated toolchain PR, see #125).
    "ruff>=0.16.5,<0.17",
    "mypy>=2.3.1,<3",
    "bandit>=1.8.6",
]

# Note: pyintellicenter is installed from local path during development:
#   uv pip install -e ../pyintellicenter
# For production, it will be installed via manifest.json requirements
