[mypy]
python_version = 3.14
platform = linux

# Enable strict type checking (with adjustments for HA integration development)
# - disallow_any_generics = False: HA uses generics without type params
# - disallow_subclassing_any = False: Required for subclassing HA base classes
# - disallow_untyped_decorators = False: HA decorators often lack type info
strict = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_any_generics = False
disallow_subclassing_any = False
disallow_untyped_calls = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Home Assistant and pyintellicenter are treated as untyped boundaries.
# follow_imports = skip makes mypy treat their symbols as Any instead of
# checking the integration against their (fast-moving) public APIs. This matches
# how mypy has always run here (CI ran it without Home Assistant installed), and
# keeps the strict gate focused on our own code. Type drift against Home
# Assistant's current API is tracked as a separate modernization effort.
[mypy-homeassistant.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-pytest_homeassistant_custom_component.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-voluptuous.*]
ignore_missing_imports = True

[mypy-zeroconf.*]
ignore_missing_imports = True

[mypy-pyintellicenter.*]
ignore_missing_imports = True
follow_imports = skip
