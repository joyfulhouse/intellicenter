[project]
name = "intellicenter"
version = "3.8.1"
description = "Home Assistant custom integration for Pentair IntelliCenter"
readme = "README.md"
license = "GPL-3.0-only"
authors = [
    { name = "JoyfulHouse Real Estate LLC" },
]
# Tracks the Python floor of the Home Assistant release we target (2026.5.x ->
# Python 3.14.2+). HACS installs by copying files and does not read this; it
# governs our uv/CI tooling, which must resolve against that HA version.
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant>=2025.11.3",
    "pyintellicenter>=0.1.21",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black/formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "E203",  # whitespace before ':'
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
forced-separate = ["tests"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Use of assert detected

[tool.codespell]
ignore-words-list = "hass,timout"
skip = ".git,*.json,*.csv"
quiet-level = 2

# mypy configuration is centralized in mypy.ini (strict mode).
# Do not add a [tool.mypy] block here: mypy.ini takes precedence over
# pyproject.toml, so a second config would silently diverge.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = [
    ".git",
    ".venv",
    "venv",
]

[dependency-groups]
dev = [
    "homeassistant==2026.5.4",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "pytest-homeassistant-custom-component>=0.13.333",
    # Lint/type/security tools pinned via the lock so CI (uv sync --frozen) and
    # local runs use identical versions instead of whatever is on PATH.
    # ruff is held <0.15 and mypy <2 to match the repo's current format/type
    # baseline: ruff 0.15 reformats unrelated files and mypy 2.x rejects HA's
    # Python 3.14 syntax. Adopting those is a separate repo-wide change.
    "ruff>=0.14.5,<0.15",
    "mypy>=1.18.2,<2",
    "bandit>=1.8.6",
]

# Note: pyintellicenter is installed from local path during development:
#   uv pip install -e ../pyintellicenter
# For production, it will be installed via manifest.json requirements
